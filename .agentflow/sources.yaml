# External documentation sources.
#
# `python scaffold_agentflow.py sync-sources` clones each repo with
# git sparse-checkout (shallow, filtered) into .agentflow/.sources/<name>/
# and copies the listed paths into target_dir under .agentflow/.
#
# Edit this file to add your own repos, then run sync-sources.

sources:

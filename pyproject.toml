[project]
name = "machine-learning-pipeline"
version = "0.1.0"
description = "Python FastAPI backend with static HTML frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "joblib>=1.6.0",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-google-genai>=4.3.7",
    "langgraph>=1.2.11",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

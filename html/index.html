<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machine Learning Pipeline</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      background: var(--card);
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 40rem;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }

    p {
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-size: 0.9rem;
    }

  </style>
</head>
<body>
  <main>
    <h1>Machine Learning Pipeline</h1>
    <p>
      Python FastAPI backend with a static HTML frontend. Use the API health
      endpoint to verify the application and database connection.
    </p>
    <div class="status" id="status">Checking API health…</div>
  </main>
  <script>
    fetch("/health")
      .then((response) => response.json())
      .then((data) => {
        const dbStatus = data.database ? "connected" : "unavailable";
        document.getElementById("status").textContent =
          `API ${data.status} · database ${dbStatus}`;
      })
      .catch(() => {
        document.getElementById("status").textContent = "API unavailable";
      });
  </script>
</body>
</html>
